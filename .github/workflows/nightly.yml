name: Nightly

# What a pull request cannot afford to wait for. The property suite runs at
# fifty times its per-pull-request search, and the benchmark runs long enough
# for a slow leak to show, both against the same thresholds CI enforces so a
# nightly failure is never a different standard.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deep:
    name: Widened property search, long benchmark, and system suite
    runs-on: ubuntu-24.04
    env:
      DERPEX_BUILD: "1"
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: "1.98.0"

      - name: Cache build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
            ~/.cargo/git
            ~/.cargo/registry
            native/derpex_crypto/target
          key: nightly-${{ runner.os }}-${{ hashFiles('mix.lock', 'native/derpex_crypto/Cargo.lock') }}

      - name: Fetch dependencies
        run: mix deps.get --only test

      - name: Widen the property search
        env:
          PROPERTY_RUNS: "5000"
        run: mix test test/property

      # The same three thresholds the pull-request smoke enforces, over ten
      # times the packets: a per-flow leak too small to cross 1 MiB at 2,000
      # packets crosses it at 20,000, and a stall that only appears once the
      # slow client has been unread for half a minute has time to appear.
      - name: Run the benchmark at pull-request thresholds over a longer run
        run: >-
          mix bench -- --packets 20000 --sizes 64,1200 --slow-packets 20000
          --slow-delay-ms 30000
          --fail-on queue_replacements=0
          --fail-on memory_delta_bytes=1048576
          --fail-on latency_p99_us=25000

      - name: Run system tests
        run: mix test.system
