name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Elixir and native quality
    runs-on: ubuntu-24.04
    env:
      DERPEX_BUILD: "1"
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt

      - name: Cache build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
            ~/.cargo/git
            ~/.cargo/registry
            native/derpex_crypto/target
          key: quality-${{ runner.os }}-${{ hashFiles('mix.lock', 'native/derpex_crypto/Cargo.lock') }}

      - name: Fetch dependencies
        run: mix deps.get --only test

      - name: Run quality gate
        run: mix quality

      - name: Run unit and property tests
        run: mix test

      - name: Run system tests
        run: mix test.system

      - name: Run Rust tests
        run: cargo test --locked --manifest-path native/derpex_crypto/Cargo.toml --all-targets

      - name: Smoke relay benchmark harness
        run: mix bench -- --packets 50 --sizes 64,1200 --slow-packets 200 --slow-delay-ms 50

  go-interop:
    name: Official Go client interoperability
    needs: quality
    runs-on: ubuntu-24.04
    env:
      DERPEX_BUILD: "1"
      DERPEX_GO_INTEROP: "1"
      DERPEX_TAILSCALE_DIR: ${{ github.workspace }}/upstream/tailscale
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the normative Tailscale revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tailscale/tailscale
          ref: 1e69418c298b680562a2fecd7020f7f58d17d166
          path: upstream/tailscale

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: "1.98.0"

      - name: Set up pinned Go oracle toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Fetch Elixir dependencies
        run: mix deps.get --only test

      - name: Check Go interoperability helpers
        run: |
          diff="$(gofmt -d interop/go)"
          test -z "$diff" || { printf '%s\n' "$diff"; exit 1; }

      - name: Run pinned upstream oracle packages
        working-directory: upstream/tailscale
        run: >-
          go test -count=1
          ./derp
          ./derp/derpserver
          ./derp/derphttp
          ./cmd/derper
          ./prober
          ./derp/xdp

      - name: Run Go clients, differential oracle, and tsnet-stack smokes
        run: >-
          mix test test/interop/go_client_test.exs
          test/interop/differential_test.exs
          test/interop/tsnet_stack_test.exs --trace

  rust-interop:
    name: Official Rust client interoperability
    needs: quality
    runs-on: ubuntu-24.04
    env:
      DERPEX_BUILD: "1"
      DERPEX_RUST_INTEROP: "1"
      DERPEX_TAILSCALE_RS_DIR: ${{ github.workspace }}/upstream/tailscale-rs
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the pinned official Rust client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tailscale/tailscale-rs
          ref: 1a969ad5dd753aa3b2bbb91499ed64cc6baef621
          path: upstream/tailscale-rs

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Set up pinned Rust oracle toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: "1.95.0"

      - name: Cache build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
            ~/.cargo/git
            ~/.cargo/registry
            native/derpex_crypto/target
          key: rust-interop-${{ runner.os }}-${{ hashFiles('mix.lock', 'native/derpex_crypto/Cargo.lock', 'upstream/tailscale-rs/Cargo.lock') }}

      - name: Fetch Elixir dependencies
        run: mix deps.get --only test

      - name: Run official Rust client smoke
        run: mix test test/interop/rust_client_test.exs --trace

  runtime-boundary:
    name: Compiler-free runtime image
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build development image from source
        run: docker build --load --target runtime_source --tag derpex:ci .

      - name: Prove runtime toolchain boundary and NIF load
        run: |
          docker run --rm --entrypoint sh derpex:ci -ec '
            for tool in go gofmt cargo rustc rustup mix; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "forbidden runtime tool: $tool" >&2
                exit 1
              fi
            done
            test ! -e /opt/derpex/native
            test ! -e /opt/derpex/interop
            test ! -e /opt/derpex/test
            if find /opt/derpex -type f \( -name "*.go" -o -name "*.rs" \) | grep -q .; then
              echo "forbidden Go/Rust source in runtime image" >&2
              exit 1
            fi
            /opt/derpex/bin/derpex eval "unless Derpex.Crypto.loaded?(), do: System.halt(1)"
          '

      - name: Boot production TLS and hot-reload its certificate
        run: scripts/runtime_smoke.sh derpex:ci
