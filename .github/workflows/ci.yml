name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Elixir and native quality
    runs-on: ubuntu-24.04
    env:
      DERPEX_BUILD: "1"
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt

      - name: Cache build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
            ~/.cargo/git
            ~/.cargo/registry
            native/derpex_crypto/target
          key: quality-${{ runner.os }}-${{ hashFiles('mix.lock', 'native/derpex_crypto/Cargo.lock') }}

      - name: Fetch dependencies
        run: mix deps.get --only test

      - name: Run quality gate
        run: mix quality

      - name: Run Rust tests
        run: cargo test --locked --manifest-path native/derpex_crypto/Cargo.toml --all-targets

  go-interop:
    name: Official Go client interoperability
    needs: quality
    runs-on: ubuntu-24.04
    env:
      DERPEX_BUILD: "1"
      DERPEX_GO_INTEROP: "1"
      DERPEX_TAILSCALE_DIR: ${{ github.workspace }}/upstream/tailscale
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the normative Tailscale revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tailscale/tailscale
          ref: 1e69418c298b680562a2fecd7020f7f58d17d166
          path: upstream/tailscale

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@0f75c29430f34bb5af4cce5e3b7f6a8860fca236 # v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-28
        with:
          toolchain: "1.98.0"

      - name: Set up pinned Go oracle toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Fetch Elixir dependencies
        run: mix deps.get --only test

      - name: Run unchanged official Go client smoke
        run: mix test test/interop/go_client_test.exs --trace

  runtime-boundary:
    name: Compiler-free runtime image
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build development image from source
        run: docker build --load --target runtime_source --tag derpex:ci .

      - name: Prove runtime toolchain boundary and NIF load
        run: |
          docker run --rm --entrypoint sh derpex:ci -ec '
            for tool in go gofmt cargo rustc rustup mix; do
              if command -v "$tool" >/dev/null 2>&1; then
                echo "forbidden runtime tool: $tool" >&2
                exit 1
              fi
            done
            test ! -e /opt/derpex/native
            test ! -e /opt/derpex/interop
            test ! -e /opt/derpex/test
            /opt/derpex/bin/derpex eval "unless Derpex.Crypto.loaded?(), do: System.halt(1)"
          '
